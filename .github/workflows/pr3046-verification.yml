name: PR 3046 isolated verification
on:
  push:
    branches: ['verify/pr3046-20261029']
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 868fdbcb530cf693433cfb90c6af11965e6d652a
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - name: Build unmodified upstream for coverage comparison
        run: |
          git checkout 8bac0ba7b5403ceb00879e0f2cf980f667b5ecc1
          npm run build:cli
          npm run build --workspace @calmstudio/calm-core --workspace @calmstudio/mcp
      - name: Baseline coverage thresholds on unchanged upstream
        continue-on-error: true
        run: npm run test --workspace @calmstudio/calm-core --workspace @calmstudio/extensions --workspace @calmstudio/mcp --workspace @calmstudio/studio -- --coverage
      - name: Restore and build tested patch
        if: always()
        run: |
          git checkout 868fdbcb530cf693433cfb90c6af11965e6d652a
          npm run build:cli
      - name: Lint all workspaces
        if: always()
        run: npm run lint
      - name: Typecheck learning lab
        if: always()
        run: npm run typecheck --workspace calm-lab
